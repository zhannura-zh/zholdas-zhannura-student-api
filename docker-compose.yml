name: zholdas-zhannura-student-api
services:
  postgres-db:
    image: postgres:15-alpine
    container_name: zholdas-postgres-db
    environment:
      POSTGRES_DB: ${DB_NAME:-student_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your local .env}
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - student-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
  student-api:
    build: .
    image: zholdas-zhannura-student-api:v1.1-zholdas-zhannura
    container_name: zholdas-student-api
    depends_on:
      postgres-db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres-db:5432/${DB_NAME:-student_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your local .env}
      APP_VERSION: "1.1.0"
    ports:
      - "127.0.0.1:${APP_HOST_PORT:-8080}:8080"
    networks:
      - student-network
# Keep the named data volume already used on this computer.
volumes:
  postgres_data:
    name: zholdas_postgres_data
networks:
  student-network:
    name: zholdas_student_network
